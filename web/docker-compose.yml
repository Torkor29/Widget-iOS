# On the VPS: cp .env.example .env, fill it, then `docker compose up -d --build`.
# If the VPS already runs a reverse proxy on ports 80/443, remove the caddy
# service and point your proxy to the web container's port 3000.
services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_APP_STORE_URL: ${NEXT_PUBLIC_APP_STORE_URL:-}
        CONTACT_EMAIL: ${CONTACT_EMAIL}
        LEGAL_NAME: ${LEGAL_NAME}
        LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
