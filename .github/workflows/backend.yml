name: Backend

on:
  push:
    branches: [main, "claude/**"]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    name: Database & functions checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migration tests (PGlite)
        working-directory: supabase/tests
        run: npm install --no-audit --no-fund && npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check, lint & format Edge Functions
        working-directory: supabase/functions
        run: |
          deno check --config deno.json */index.ts
          deno lint --config deno.json
          deno fmt --config deno.json --check

  deploy:
    name: Deploy to Supabase
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Skip (not configured)
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and vars.SUPABASE_PROJECT_REF to deploy."
      - name: Link project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push
      - name: Set function secrets
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.MORNI_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.MORNI_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          args=()
          for name in APNS_KEY_ID APNS_TEAM_ID APNS_BUNDLE_ID APNS_PRIVATE_KEY REVENUECAT_WEBHOOK_AUTH CRON_SECRET; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
      - name: Deploy Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy --project-ref "$PROJECT_REF"
