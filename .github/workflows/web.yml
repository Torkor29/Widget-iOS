name: Website

on:
  push:
    branches: [main, "claude/**"]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/morni/web' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip (not configured)
        if: env.VPS_HOST == ''
        run: echo "::notice::Set VPS_HOST, VPS_USER and VPS_SSH_KEY secrets to deploy the website."
      - name: Upload and restart
        if: env.VPS_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_deploy"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH'"
          rsync -az --delete --exclude node_modules --exclude .next --exclude .env -e "$SSH" web/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          $SSH "$VPS_USER@$VPS_HOST" "cd '$VPS_PATH' && docker compose up -d --build && docker image prune -f"
