name: iOS

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a build to TestFlight
        type: boolean
        default: true
      certificates:
        description: Create/refresh signing certificates first (first run only)
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  MORNI_BUNDLE_ID: ${{ vars.MORNI_BUNDLE_ID }}
  MORNI_APP_GROUP: ${{ vars.MORNI_APP_GROUP }}
  MORNI_TEAM_ID: ${{ vars.MORNI_TEAM_ID }}
  MORNI_WEB_DOMAIN: ${{ vars.MORNI_WEB_DOMAIN }}
  MORNI_SUPABASE_HOST: ${{ vars.MORNI_SUPABASE_HOST }}
  MORNI_SUPABASE_ANON_KEY: ${{ vars.MORNI_SUPABASE_ANON_KEY }}
  MORNI_REVENUECAT_KEY: ${{ vars.MORNI_REVENUECAT_KEY }}
  MORNI_GOOGLE_CLIENT_ID: ${{ vars.MORNI_GOOGLE_CLIENT_ID }}
  MORNI_GOOGLE_REVERSED_CLIENT_ID: ${{ vars.MORNI_GOOGLE_REVERSED_CLIENT_ID }}

jobs:
  build:
    name: Build (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Secrets.xcconfig
        run: ../scripts/write-ios-secrets.sh > Config/Secrets.xcconfig
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project Morni.xcodeproj -scheme Morni -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Secrets.xcconfig
        run: ../scripts/write-ios-secrets.sh > Config/Secrets.xcconfig
      - name: Generate project
        run: xcodegen generate
      - name: Certificates
        if: inputs.certificates
        run: bundle exec fastlane certificates
      - name: Build & upload
        run: bundle exec fastlane beta
